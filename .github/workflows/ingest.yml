name: Google Trends Ingestor

on:
  workflow_dispatch: # Manual trigger via the GitHub UI "Run workflow" button.
  schedule:
    - cron: "0 6 * * 1" # Every Monday at 06:00 UTC — new weekly data is available by then.

jobs:
  ingest:
    runs-on: ubuntu-latest

    env:
      INGESTOR_ROLE_ARN: ${{ secrets.INGESTOR_ROLE_ARN }}
      S3_BUCKET: undercurrent-raw-data

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ingestion/requirements.txt

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1

      - name: Install ingestion dependencies
        run: pip install -r ingestion/requirements.txt

      - name: Run Google Trends ingestor
        run: python -m ingestion.google_trends.main
